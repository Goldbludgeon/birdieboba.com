<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="./img/favicon.ico" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blorbie Boba</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #6c5ce7;
      transition: background 0.3s ease;
      font-family: system-ui, sans-serif;
      overflow: hidden;
    }

    .picker {
      position: fixed;
      top: 1rem;
      right: 1rem;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red);
      cursor: pointer;
      overflow: hidden;
    }

    .picker input[type="color"] {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    #photo {
      width: min(70vw, 300px);
      height: auto;
      cursor: pointer;
      transition: transform 0.15s ease;
      user-select: none;
    }

    #photo:active { transform: scale(0.95); }
  </style>
</head>
<body>

  <label class="picker" title="Select your background color!">
    <input type="color" id="bgPicker" value="#B9AAF4" />
  </label>

  <img
    id="photo"
    src="./img/blorb.png"
    alt="wiwiwi"
  />

  <script src="./app.js"></script>

</body>
</html>
